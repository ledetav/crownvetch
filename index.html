<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Crownvetch — Darkroom / Script</title>
    <!--
      Восстанавливает полный путь (pathname + search + hash) после редиректа со страницы 404.html на GitHub Pages
      и доскролливает к целевому элементу по якорю после загрузки DOM/ресурсов.
    -->
    <script>
      (function () {
        var SPA_REDIRECT_KEY = 'crownvetch_spa_redirect';

        // Извлекает сохранённый путь из sessionStorage до монтирования клиентского роутера
        var pendingRedirect = sessionStorage.getItem(SPA_REDIRECT_KEY);
        if (pendingRedirect) {
          sessionStorage.removeItem(SPA_REDIRECT_KEY);
          window.history.replaceState(null, '', pendingRedirect);
        }

        // Прокручивает страницу к элементу с id, соответствующему текущему hash-якорю
        function scrollToAnchorHash() {
          var currentHash = window.location.hash;
          if (!currentHash || currentHash.length < 2) {
            return;
          }

          var targetId = decodeURIComponent(currentHash.slice(1));
          var targetElement = document.getElementById(targetId);
          if (targetElement) {
            targetElement.scrollIntoView();
          }
        }

        // Повторная проверка на load нужна для элементов, размер и позиция которых уточняются после загрузки медиа/шрифтов
        window.addEventListener('DOMContentLoaded', scrollToAnchorHash);
        window.addEventListener('load', scrollToAnchorHash);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
