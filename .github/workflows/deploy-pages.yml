name: Deploy to GitHub Pages

# Публикация собранного Vite-приложения в GitHub Pages при пуше в main или ручном запуске.
on:
  push:
    branches:
      - main
  workflow_dispatch:

# Минимально необходимые права для выгрузки артефакта и деплоя на GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Последовательная публикация без отмены текущих деплоев
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install

      # Передаём GITHUB_PAGES=true только в шаг сборки Pages, чтобы base=/crownvetch/ не влиял на локальный запуск и Vercel
      - name: Build for GitHub Pages
        env:
          GITHUB_PAGES: "true"
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
