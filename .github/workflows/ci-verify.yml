name: CI Verify & Visual Audit

on:
  push:
    branches-ignore:
      - ci-reports
  pull_request:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ci-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-and-audit:
    name: Lint, Build & Visual Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install frontend dependencies
        run: npm install

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript typecheck and Vite build
        run: npm run build

      - name: Setup Python for visual audit
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Playwright and Chromium
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          playwright install chromium --with-deps

      - name: Start preview server and run UI audit
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 &
          SERVER_PID=$!
          for i in $(seq 1 30); do
            if curl -s http://127.0.0.1:4173 > /dev/null; then
              break
            fi
            sleep 1
          done
          AUDIT_BASE_URL=http://127.0.0.1:4173 AUDIT_OUTPUT_DIR=ci-artifacts python scripts/ui_audit.py
          AUDIT_EXIT=$?
          kill $SERVER_PID || true
          exit $AUDIT_EXIT

      - name: Publish screenshots and report to ci-reports branch
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -rf /tmp/ci-artifacts
          cp -r ci-artifacts /tmp/ci-artifacts

          if git ls-remote --exit-code --heads origin ci-reports > /dev/null 2>&1; then
            git fetch origin ci-reports
            git checkout -B ci-reports origin/ci-reports
          else
            git checkout --orphan ci-reports
            git rm -rf . || true
          fi

          mkdir -p latest
          rm -rf latest/*
          cp -r /tmp/ci-artifacts/* latest/
          git add latest
          git commit -m "ci(reports): update visual audit artifacts" || echo "No report changes"
          git push origin ci-reports --force

      - name: Comment PR with visual audit summary
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            if (!fs.existsSync('/tmp/ci-artifacts/ci-summary.md')) return;
            const summary = fs.readFileSync('/tmp/ci-artifacts/ci-summary.md', 'utf8');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: summary
            });
