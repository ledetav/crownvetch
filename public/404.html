<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Redirecting...</title>
    <!--
      Fallback для статического хостинга GitHub Pages: при прямом запросе глубокого SPA-маршрута
      сохраняет исходный путь, query-строку и #якорь в sessionStorage и возвращает на корень проекта.
    -->
    <script>
      (function () {
        var SPA_REDIRECT_KEY = 'crownvetch_spa_redirect';
        var PAGES_PREFIX = '/crownvetch';
        var currentPathname = window.location.pathname;

        // Определяет корень приложения: '/crownvetch/' на GitHub Pages или '/' на корневом домене
        var isPagesSubpath =
          currentPathname === PAGES_PREFIX ||
          currentPathname.indexOf(PAGES_PREFIX + '/') === 0;
        var basePath = isPagesSubpath ? PAGES_PREFIX + '/' : '/';

        // Формирует полный целевой адрес с сохранением вложенного маршрута, параметров и якоря
        var targetUrl =
          currentPathname +
          window.location.search +
          window.location.hash;

        sessionStorage.setItem(SPA_REDIRECT_KEY, targetUrl);
        window.location.replace(basePath);
      })();
    </script>
  </head>
  <body></body>
</html>
